name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK parts
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"

      - name: Setup Godot 4.3 & Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Build DaydreamBle plugin (AAR)
        run: |
          cd android_plugin
          gradle --no-daemon assembleRelease
          mkdir -p ../addons/daydream_ble/bin
          cp build/outputs/aar/*-release.aar ../addons/daydream_ble/bin/daydream_ble.aar

      - name: Install Android build template into the project
        run: |
          mkdir -p android/build
          TEMPLATE_ZIP=$(find ~ -name "android_source.zip" | head -n 1)
          unzip -q "$TEMPLATE_ZIP" -d android/build
          echo -n "4.3.stable" > android/.build_version
          touch android/build/.gdignore

      - name: Configure Godot editor settings and debug keystore
        run: |
          keytool -genkey -v -keystore "$PWD/debug.keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project resources
        run: godot --headless --import || true

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/DaydreamVR.apk
          ls -la build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaydreamVR-apk
          path: build/DaydreamVR.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка (DaydreamVR APK)
          body: Скачайте DaydreamVR.apk и установите на телефон.
          files: build/DaydreamVR.apk
          make_latest: true
