name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK parts
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Godot 4.3 & Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Build Android BLE Plugin (AAR)
        run: |
          cd android_plugin
          chmod +x gradlew || true
          gradle assembleRelease || ./gradlew assembleRelease
          mkdir -p ../addons/daydream_ble/bin/release
          cp app/build/outputs/aar/*release*.aar ../addons/daydream_ble/bin/release/daydream_ble-release.aar

      - name: Configure Godot Android SDK Path
        run: |
          mkdir -p ~/.config/godot
          cat << 'EOF' > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = ""
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          keytool -genkey -v -keystore ~/.local/share/godot/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          sed -i "s|export/android/debug_keystore = \"\"|export/android/debug_keystore = \"$HOME/.local/share/godot/debug.keystore\"|" ~/.config/godot/editor_settings-4.3.tres

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --import
          godot --headless --path . --export-debug "Android" build/DaydreamVR.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка (DaydreamVR APK)
          body: Скачайте DaydreamVR.apk и установите на телефон.
          files: build/DaydreamVR.apk
          make_latest: true
